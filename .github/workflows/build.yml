name: Build and publish image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore: ["**.md", "unraid/**"]
  pull_request:
    branches: ["main"]
  # Claude Code releases often. A weekly rebuild keeps :latest reasonably fresh
  # without anyone having to remember to click anything.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      claude_code_version:
        description: "Claude Code npm version to bake in"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skipped for PRs from forks, which have no push credentials.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Unraid is x86_64 only, so there is nothing to gain from multi-arch.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CLAUDE_CODE_VERSION=${{ inputs.claude_code_version || 'latest' }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Smoke test the image
        # On PRs the image is loaded locally; otherwise pull the tag we pushed.
        run: |
          set -euo pipefail
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Testing $IMAGE"
          docker run --rm --entrypoint claude "$IMAGE" --version
          docker run --rm --entrypoint bash "$IMAGE" -c 'command -v git rg jq gosu tini'
